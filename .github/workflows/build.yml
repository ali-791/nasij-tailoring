name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore TailoringShop.sln
      
    - name: Build
      run: dotnet build TailoringShop.sln --configuration Release --no-restore
      
    - name: Publish
      run: dotnet publish TailoringShop.WPF/TailoringShop.WPF.csproj -c Release -o ./publish --self-contained true -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nasij-Windows-x64
        path: ./publish/
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: Nasij-Windows-x64
        path: ./release
        
    - name: Zip release
      run: |
        cd release
        zip -r ../Nasij-${{ github.ref_name }}-Windows-x64.zip .
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: Nasij-${{ github.ref_name }}-Windows-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
